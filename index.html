<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group 23: Custom Presets</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; color: #fff; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* UI Overlay */
        #ui-panel {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0, 0, 0, 0.8); border: 1px solid #333; padding: 20px;
            border-left: 4px solid #ff3333; backdrop-filter: blur(5px); width: 300px;
        }
        h1 { font-size: 16px; margin: 0 0 15px 0; border-bottom: 1px solid #555; padding-bottom: 5px; }
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: #aaa; margin-bottom: 5px; }
        select, input[type="color"] { width: 100%; background: #111; border: 1px solid #444; color: #fff; padding: 5px; outline: none; }
        
        .upload-btn {
            display: block; width: 100%; background: #222; color: #00ffff;
            border: 1px dashed #00ffff; padding: 10px; text-align: center; cursor: pointer; font-size: 12px; box-sizing: border-box;
        }
        .upload-btn:hover { background: rgba(0, 255, 255, 0.1); }
        
        button#fullscreen-btn { width: 100%; background: #ff3333; border: none; color: #000; padding: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        #status { margin-top: 10px; font-size: 12px; color: cyan; min-height: 1.5em; }
        #slogan { position: absolute; bottom: 30px; left: 30px; z-index: 5; pointer-events: none; }
        .slogan-main { font-size: 40px; font-weight: bold; color: rgba(255,255,255,0.15); text-transform: uppercase; }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; display: flex; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s; }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div style="text-align:center;">
            <div style="font-size: 24px; animation: blink 1s infinite;">INITIALIZING SURVEILLANCE LAYER...</div>
            <div style="color: #ff3333; margin-top:10px;">GROUP 23 | RED PILL ACCESS</div>
        </div>
    </div>

    <div id="ui-panel">
        <h1>Artifact Control</h1>
        
        <div class="control-group">
            <label>1. SELECT MODEL</label>
            <select id="shape-select">
                <option value="model_a">Preset: Model A</option>
                <option value="model_b">Preset: Model B</option>
                <option value="custom" disabled>-- Custom Upload Below --</option>
            </select>
        </div>

        <div class="control-group">
            <label>2. OR UPLOAD SKETCH</label>
            <label for="file-input" class="upload-btn">
                [ CLICK TO UPLOAD IMAGE ]<br>
                <span style="font-size:9px; color:#aaa;">Override Preset</span>
            </label>
            <input type="file" id="file-input" accept="image/*" style="display:none;">
        </div>

        <div class="control-group">
            <label>3. DATA COLOR</label>
            <input type="color" id="color-picker" value="#00ffff">
        </div>

        <div id="status">Waiting for camera...</div>
        <button id="fullscreen-btn">ENTER FULLSCREEN</button>
    </div>

    <div id="slogan">
        <div class="slogan-main">LOST IN MATTER</div>
    </div>

    <div id="canvas-container"></div>
    <video id="input-video" style="display:none;" playsinline></video>
    <canvas id="image-processor" style="display:none;"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        // --- CONFIGURATION ---
        const config = {
            particleCount: 20000, 
            particleSize: 0.06,
            dispersionStrength: 10.0,
            defaultColor: new THREE.Color(0x00ffff),
            // 修改点：定义你的预设文件名
            presets: {
                'model_a': './model_a.png',
                'model_b': './model_b.png'
            }
        };

        // --- THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // --- PARTICLE SYSTEM ---
        let particles;
        let geometry;
        let originalPositions = new Float32Array(config.particleCount * 3); 
        let currentPositions = new Float32Array(config.particleCount * 3);  
        let randomTargets = new Float32Array(config.particleCount * 3);     
        
        let dispersionFactor = 0; 
        let targetDispersion = 0; 
        let isFlatImage = true; // 现在默认都是图片，所以默认为 True

        geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
        const material = new THREE.PointsMaterial({
            color: config.defaultColor,
            size: config.particleSize,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            sizeAttenuation: true
        });
        particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- IMAGE LOADER (New Logic) ---
        
        function loadPresetImage(path) {
            const img = new Image();
            img.crossOrigin = "Anonymous"; // 尝试解决跨域，但在本地 file:// 依然无效，需要 Live Server
            img.onload = function() {
                processImageToParticles(img);
            };
            img.onerror = function() {
                alert("无法加载图片！\n\n如果你是双击打开的HTML，浏览器会阻止加载本地图片。\n\n请使用 VS Code 的 'Live Server' 打开，或者直接使用下方【Upload】按钮手动上传。");
            };
            img.src = path;
        }

        function processImageToParticles(image) {
            isFlatImage = true; 
            if(particles) particles.rotation.set(0, 0, 0);

            const canvas = document.getElementById('image-processor');
            const ctx = canvas.getContext('2d');
            const size = 200; 
            canvas.width = size;
            canvas.height = size * (image.height / image.width); 

            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const validPixels = [];
            
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const index = (y * canvas.width + x) * 4;
                    const brightness = (data[index] + data[index+1] + data[index+2]) / 3;
                    if (brightness < 200 && data[index+3] > 0) { // Dark pixel + Not transparent
                        const pX = (x / canvas.width) * 16 - 8; 
                        const pY = -((y / canvas.height) * 16 * (canvas.height/canvas.width)) + (8 * (canvas.height/canvas.width)); 
                        validPixels.push({x: pX, y: pY});
                    }
                }
            }

            if (validPixels.length === 0) { console.warn("Image empty or too light"); return; }

            for (let i = 0; i < config.particleCount; i++) {
                const pixel = validPixels[Math.floor(Math.random() * validPixels.length)];
                originalPositions[i*3] = pixel.x;
                originalPositions[i*3+1] = pixel.y;
                originalPositions[i*3+2] = (Math.random() - 0.5) * 0.5;

                randomTargets[i*3] = pixel.x * 2 + (Math.random() - 0.5) * 10;
                randomTargets[i*3+1] = pixel.y * 2 + (Math.random() - 0.5) * 10;
                randomTargets[i*3+2] = (Math.random() - 0.5) * 20;
            }
        }

        // --- INIT ---
        // 默认加载第一个预设
        loadPresetImage(config.presets['model_a']);

        // --- INPUT HANDLING ---

        document.getElementById('shape-select').addEventListener('change', (e) => {
            if(e.target.value !== 'custom') {
                loadPresetImage(config.presets[e.target.value]);
            }
        });

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    processImageToParticles(img);
                    const select = document.getElementById('shape-select');
                    let customOpt = select.querySelector('option[value="custom"]');
                    customOpt.text = "Custom: " + file.name.substring(0,10) + "...";
                    customOpt.selected = true;
                    customOpt.disabled = false;
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        document.getElementById('color-picker').addEventListener('input', (e) => {
            particles.material.color.set(e.target.value);
        });

        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        // --- HAND TRACKING & ANIMATION (Standard Logic) ---
        const videoElement = document.getElementById('input-video');
        const statusText = document.getElementById('status');
        const loader = document.getElementById('loading-overlay');

        function onResults(results) {
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                const wrist = landmarks[0];
                const middleTip = landmarks[12];
                const indexMCP = landmarks[5];
                const dist = (p1, p2) => Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
                const scaleRef = dist(wrist, indexMCP); 
                const extension = dist(wrist, middleTip); 
                let openness = (extension / scaleRef - 0.8) / (1.8 - 0.8);
                openness = Math.max(0, Math.min(1, openness));
                targetDispersion = 1.0 - openness;

                statusText.innerHTML = `HAND DETECTED<br>DISPERSION: ${(targetDispersion * 100).toFixed(0)}%`;
                statusText.style.color = targetDispersion > 0.5 ? '#ff3333' : '#00ffff';
            } else {
                statusText.innerHTML = "NO HAND DETECTED<br>SYSTEM IDLE";
                statusText.style.color = "#555";
                targetDispersion = 0;
            }
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5});
        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 320, height: 240
        });
        cameraUtils.start().then(() => {
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        });

        function animate() {
            requestAnimationFrame(animate);
            dispersionFactor += (targetDispersion - dispersionFactor) * 0.1;
            const positions = geometry.attributes.position.array;
            
            if(dispersionFactor < 0.2) { 
                particles.rotation.y = Math.sin(Date.now() * 0.001) * 0.3;
                particles.rotation.x = Math.sin(Date.now() * 0.0007) * 0.1; 
            }

            for (let i = 0; i < config.particleCount; i++) {
                const ix = i * 3;
                const ox = originalPositions[ix]; const oy = originalPositions[ix+1]; const oz = originalPositions[ix+2];
                const tx = randomTargets[ix]; const ty = randomTargets[ix+1]; const tz = randomTargets[ix+2];
                const noise = (Math.random() - 0.5) * dispersionFactor * 0.5;
                const d = dispersionFactor; 
                positions[ix] = ox + (tx - ox) * d + noise;
                positions[ix+1] = oy + (ty - oy) * d + noise;
                positions[ix+2] = oz + (tz - oz) * d + noise;
            }
            geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
